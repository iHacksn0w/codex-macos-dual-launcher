name: tests

on:
  push:
  pull_request:

jobs:
  config-transaction:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Zsh syntax checks
        run: |
          for f in scripts/*.command install.command uninstall.command; do zsh -n "$f"; done
